<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Black Hawk Down The Game — Coming Soon</title>

    <meta name="description" content="Black Hawk Down The Game is coming soon. Stay tuned for the latest updates and prepare for an intense gaming experience.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#080a0b">

    <link rel="canonical" href="https://www.blackhawkdownthegame.com/">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% 25%, rgba(76, 82, 78, 0.18), transparent 35%),
                linear-gradient(135deg, #050606 0%, #0b0d0d 48%, #030404 100%);
            color: #ffffff;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.08;
            background-image:
                linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 45px 45px;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 18px;
            border: 1px solid rgba(191, 198, 190, 0.25);
            background: rgba(255,255,255,0.035);
            border-radius: 50px;
            color: #bfc5bd;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            margin-bottom: 28px;
        }

        .badge::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #9da99d;
            box-shadow: 0 0 12px rgba(180, 190, 180, .8);
            animation: pulse 1.7s infinite;
        }

        h1 {
            font-size: clamp(44px, 8vw, 94px);
            line-height: .95;
            letter-spacing: -3px;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 22px;
            color: #f2f3ef;
            text-shadow:
                0 3px 0 #151817,
                0 10px 30px rgba(0,0,0,.8);
        }

        h1 span {
            display: block;
            color: #9ea79e;
        }

        .subtitle {
            max-width: 650px;
            margin: 0 auto 42px;
            color: #a9aeaa;
            font-size: 16px;
            line-height: 1.8;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            max-width: 760px;
            margin: 0 auto 38px;
        }

        .time-box {
            min-height: 125px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(177, 184, 177, .18);
            background:
                linear-gradient(145deg, rgba(255,255,255,.065), rgba(255,255,255,.015));
            border-radius: 12px;
            box-shadow:
                inset 0 1px rgba(255,255,255,.05),
                0 15px 35px rgba(0,0,0,.25);
            backdrop-filter: blur(10px);
        }

        .number {
            font-size: clamp(35px, 5vw, 58px);
            font-weight: 800;
            line-height: 1;
            color: #f4f5f1;
            font-variant-numeric: tabular-nums;
        }

        .label {
            margin-top: 10px;
            color: #858c86;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .launch-date {
            color: #717872;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 38px;
        }

        .divider {
            width: 80px;
            height: 2px;
            margin: 0 auto 25px;
            background: linear-gradient(
                90deg,
                transparent,
                #9ea79e,
                transparent
            );
        }

        .footer {
            color: #555c57;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .corner {
            position: absolute;
            width: 70px;
            height: 70px;
            border-color: rgba(150, 160, 150, .18);
            pointer-events: none;
        }

        .corner.top-left {
            top: 35px;
            left: 35px;
            border-top: 1px solid;
            border-left: 1px solid;
        }

        .corner.top-right {
            top: 35px;
            right: 35px;
            border-top: 1px solid;
            border-right: 1px solid;
        }

        .corner.bottom-left {
            bottom: 35px;
            left: 35px;
            border-bottom: 1px solid;
            border-left: 1px solid;
        }

        .corner.bottom-right {
            bottom: 35px;
            right: 35px;
            border-bottom: 1px solid;
            border-right: 1px solid;
        }

        .background-circle {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 1px solid rgba(150, 160, 150, .035);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .background-circle::before,
        .background-circle::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(150, 160, 150, .025);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .background-circle::before {
            width: 700px;
            height: 700px;
        }

        .background-circle::after {
            width: 900px;
            height: 900px;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .35;
                transform: scale(.7);
            }
        }

        @media (max-width: 650px) {

            .page {
                padding: 30px 15px;
            }

            h1 {
                letter-spacing: -1.5px;
                font-size: 48px;
            }

            .subtitle {
                font-size: 14px;
                line-height: 1.7;
                margin-bottom: 32px;
            }

            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .time-box {
                min-height: 105px;
            }

            .corner {
                width: 40px;
                height: 40px;
            }

            .corner.top-left,
            .corner.top-right {
                top: 18px;
            }

            .corner.bottom-left,
            .corner.bottom-right {
                bottom: 18px;
            }

            .corner.top-left,
            .corner.bottom-left {
                left: 18px;
            }

            .corner.top-right,
            .corner.bottom-right {
                right: 18px;
            }

            .background-circle {
                width: 300px;
                height: 300px;
            }

            .background-circle::before {
                width: 450px;
                height: 450px;
            }

            .background-circle::after {
                width: 600px;
                height: 600px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="background-circle"></div>

        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <main class="container">

            <div class="badge">
                Coming Soon
            </div>

            <h1>
                Black Hawk
                <span>Down The Game</span>
            </h1>

            <p class="subtitle">
                Something big is taking shape. Prepare yourself for
                an intense new gaming experience. The countdown has begun.
            </p>

            <div class="countdown">

                <div class="time-box">
                    <div class="number" id="days">100</div>
                    <div class="label">Days</div>
                </div>

                <div class="time-box">
                    <div class="number" id="hours">00</div>
                    <div class="label">Hours</div>
                </div>

                <div class="time-box">
                    <div class="number" id="minutes">00</div>
                    <div class="label">Minutes</div>
                </div>

                <div class="time-box">
                    <div class="number" id="seconds">00</div>
                    <div class="label">Seconds</div>
                </div>

            </div>

            <div class="launch-date">
                Expected Launch · December 21, 2026
            </div>

            <div class="divider"></div>

            <div class="footer">
                <a href="/" style="color:#717872">www.blackhawkdownthegame.com</a>
            </div>

        </main>
    </div>


    <script>
        /*
         * Countdown target:
         * December 21, 2026 — 00:00:00
         */

        const targetDate = new Date("2026-12-21T00:00:00+07:00").getTime();

        function updateCountdown() {

            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById("days").textContent = "00";
                document.getElementById("hours").textContent = "00";
                document.getElementById("minutes").textContent = "00";
                document.getElementById("seconds").textContent = "00";
                return;
            }

            const days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (difference / (1000 * 60 * 60)) % 24
            );

            const minutes = Math.floor(
                (difference / (1000 * 60)) % 60
            );

            const seconds = Math.floor(
                (difference / 1000) % 60
            );

            document.getElementById("days").textContent =
                String(days).padStart(2, "0");

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
